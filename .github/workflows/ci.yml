name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported Node version and the current LTS.
        node-version: ["22", "24"]
    steps:
      # Actions are pinned to commit SHAs, since a tag can be moved to
      # different code. The comment records the version for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # deplens's dependencies don't need install scripts, so none run.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Scan deplens's own lockfile with the build that was just made.
      - run: node dist/bin.js scan .
